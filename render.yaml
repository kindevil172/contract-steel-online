services:
  - type: web
    name: contract-steel-online
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      # Accounts. If this is missing or the database is down, the game still runs and everyone plays as a guest.
      - key: DATABASE_URL
        fromDatabase:
          name: contract-steel-accounts
          property: connectionString

databases:
  - name: contract-steel-accounts
    plan: free
    region: ohio
    databaseName: contract_steel_accounts
    user: contract_steel_accounts_user
    postgresMajorVersion: "17"
